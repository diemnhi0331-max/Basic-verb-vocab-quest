<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vocab Quest – Game từ vựng</title>
<style>
:root{--bg:#f6f5ff;--card:#fff;--tx:#1d1b3a;--mut:#6b688a;--pri:#5b4bdb;--ok:#1f9d63;--bad:#d64545;--bd:#e2e0f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13122a;--card:#1d1b3a;--tx:#f0efff;--mut:#a09dc4;--pri:#8b7dff;--ok:#3ccf8e;--bad:#ff6b6b;--bd:#35335c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13122a;--card:#1d1b3a;--tx:#f0efff;--mut:#a09dc4;--pri:#8b7dff;--ok:#3ccf8e;--bad:#ff6b6b;--bd:#35335c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:28px;margin:8px 0 4px}
p.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:14px}
.lbl{font-size:13px;color:var(--mut);margin:0 0 8px;font-weight:600}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px}
button{font:inherit;color:var(--tx);background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left}
button.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 14%,var(--card))}
button.go{width:100%;background:var(--pri);color:#fff;border-color:var(--pri);text-align:center;font-weight:700;font-size:17px;padding:14px}
button.sec{width:100%;text-align:center;margin-top:10px}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:10px 0 16px}
.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:14px}
.q{font-size:32px;font-weight:800;text-align:center;margin:18px 0 22px;word-break:break-word}
.q small{display:block;font-size:13px;color:var(--mut);font-weight:600;margin-bottom:6px}
.opts{display:grid;gap:10px}
.opts button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--card))}
.opts button.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,var(--card))}
.big{font-size:56px;text-align:center;font-weight:800;color:var(--pri);margin:6px 0}
.c{text-align:center;color:var(--mut)}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.row b{color:var(--pri)}
.hide{display:none}
</style>
</head>
<body>
<main id="app"></main>
<script>
const W=[["deserve","xứng đáng"],["desire","mong muốn, khao khát"],["imply","ngụ ý, ám chỉ"],["alternative","sự lựa chọn thay thế"],["stretch","kéo dài, kéo căng"],["breed (nghĩa chuyển)","gây ra, làm nảy sinh"],["cause","gây ra"],["contribute to","góp phần vào"],["result in","dẫn đến"],["be attributed to","được cho là do"],["reverse","đảo ngược"],["imitate","bắt chước"],["obtain","đạt được, có được"],["progress","tiến bộ, phát triển"],["fulfill","thực hiện, đáp ứng"],["accomplish","hoàn thành, đạt được"],["reveal","tiết lộ, hé lộ"],["express","bày tỏ, thể hiện"],["throughout","suốt, xuyên suốt"],["dominant","thống trị, chiếm ưu thế"],["occasional","thỉnh thoảng, không thường xuyên"],["distinct","khác biệt rõ rệt"],["intriguing","hấp dẫn, gây tò mò"],["underlying","tiềm ẩn, nằm bên dưới"],["reckless","liều lĩnh, bất chấp hậu quả"],["ideal","lý tưởng"],["tempting","hấp dẫn, đầy cám dỗ"],["extra","thêm, bổ sung"],["ordinary","bình thường"],["helpless","bất lực"],["superior","vượt trội, ưu việt"],["involved","có liên quan, tham gia"],["evolved","đã phát triển, đã tiến hóa"],["relentless","dai dẳng, không ngừng nghỉ"],["inferior","kém hơn, thấp kém hơn"],["abundant","dồi dào, phong phú"],["intense","mãnh liệt, dữ dội"],["severe","nghiêm trọng, khắc nghiệt"],["urgent","khẩn cấp, cấp bách"]];
const $=s=>document.querySelector(s),app=$("#app");
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let cfg={dir:"en",n:10},S={};
function best(){try{return +localStorage.getItem("vq_best")||0}catch(e){return 0}}
function saveBest(v){try{localStorage.setItem("vq_best",v)}catch(e){}}
function home(){
 app.innerHTML=`<h1>📚 Vocab Quest</h1><p class="sub">${W.length} từ vựng · Điểm cao nhất của bạn: <b>${best()}</b></p>
 <div class="card"><p class="lbl">Chế độ</p><div class="seg" id="d">
 <button data-v="en" class="${cfg.dir=="en"?"on":""}">Anh → Việt</button>
 <button data-v="vi" class="${cfg.dir=="vi"?"on":""}">Việt → Anh</button>
 <button data-v="mix" class="${cfg.dir=="mix"?"on":""}">Trộn</button></div></div>
 <div class="card"><p class="lbl">Số câu</p><div class="seg" id="n">
 ${[10,20,W.length].map(n=>`<button data-v="${n}" class="${cfg.n==n?"on":""}">${n==W.length?"Tất cả "+n:n+" câu"}</button>`).join("")}</div></div>
 <button class="go" id="go">Bắt đầu chơi</button>
 <button class="sec" id="ls">Xem danh sách từ</button>`;
 $("#d").onclick=e=>{const b=e.target.closest("button");if(b){cfg.dir=b.dataset.v;home()}};
 $("#n").onclick=e=>{const b=e.target.closest("button");if(b){cfg.n=+b.dataset.v;home()}};
 $("#go").onclick=start;$("#ls").onclick=list;
}
function list(){
 app.innerHTML=`<h1>Danh sách từ</h1><div class="card">${W.map(w=>`<div class="row"><b>${w[0]}</b><span>${w[1]}</span></div>`).join("")}</div><button class="sec" id="b">← Quay lại</button>`;
 $("#b").onclick=home;
}
function start(){
 S={qs:sh(W).slice(0,cfg.n),i:0,score:0,streak:0,wrong:[],lock:false};
 S.qs=S.qs.map(w=>({w,toVi:cfg.dir=="en"?true:cfg.dir=="vi"?false:Math.random()<.5}));
 ask();
}
function ask(){
 const q=S.qs[S.i],k=q.toVi?1:0,t=q.toVi?0:1;
 const opts=sh([q.w,...sh(W.filter(x=>x!==q.w)).slice(0,3)]);
 S.lock=false;
 app.innerHTML=`<div class="top"><span>Câu ${S.i+1}/${S.qs.length}</span><span>⭐ ${S.score} · 🔥 ${S.streak}</span></div>
 <div class="bar"><i style="width:${S.i/S.qs.length*100}%"></i></div>
 <div class="card"><div class="q"><small>${q.toVi?"Nghĩa của từ này là gì?":"Từ tiếng Anh nào có nghĩa là?"}</small>${q.w[t]}</div>
 <div class="opts">${opts.map((o,i)=>`<button data-i="${i}">${o[k]}</button>`).join("")}</div></div>`;
 document.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{
  if(S.lock)return;S.lock=true;
  const pick=opts[b.dataset.i],right=pick===q.w;
  document.querySelectorAll(".opts button").forEach((x,i)=>{if(opts[i]===q.w)x.classList.add("ok")});
  if(right){S.score+=10+Math.min(S.streak,5)*2;S.streak++}else{b.classList.add("bad");S.streak=0;S.wrong.push(q.w)}
  setTimeout(()=>{S.i++;S.i<S.qs.length?ask():end()},right?600:1400);
 });
}
function end(){
 const b=best(),nb=S.score>b;if(nb)saveBest(S.score);
 const ok=S.qs.length-S.wrong.length;
 app.innerHTML=`<h1 class="c">Hoàn thành! 🎉</h1><div class="big">${S.score}</div>
 <p class="c">Đúng ${ok}/${S.qs.length} câu${nb?" · 🏆 Kỷ lục mới!":""}</p>
 ${S.wrong.length?`<div class="card"><p class="lbl">Từ cần ôn lại</p>${S.wrong.map(w=>`<div class="row"><b>${w[0]}</b><span>${w[1]}</span></div>`).join("")}</div>`:`<div class="card c">Tuyệt vời, không sai câu nào! 💯</div>`}
 <button class="go" id="a">Chơi lại</button><button class="sec" id="h">Về trang chủ</button>`;
 $("#a").onclick=start;$("#h").onclick=home;
}
home();
</script>
</body>
</html>
